<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="logo">Wave</span>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" data-view="all">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                    <span>Todas las canciones</span>
                </div>
            </div>
            <div class="sidebar-section">
                <span class="sidebar-title">Playlists</span>
                <div id="playlists-list"></div>
            </div>
        </aside>

        <!-- Main content -->
        <main id="main">
            <header id="topbar">
                <div class="search-container">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="search-icon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                    <input type="text" id="search" placeholder="Buscar canciones, artistas, álbumes..." />
                </div>
                <div class="topbar-actions">
                    <button id="btn-add" class="btn-primary">+ Agregar música</button>
                    <button id="btn-mini" class="btn-icon" title="Mini player">⊞</button>
                    <button id="btn-lyrics" class="btn-icon" title="Letra">♪</button>
                    <button id="btn-eq" class="btn-icon" title="Ecualizador">EQ</button>
                    <button id="btn-backup" class="btn-icon" title="Backup">💾</button>
                </div>
            </header>

            <div id="content">
                <div id="songs-container">
                    <div id="songs-header">
                        <span id="song-count">0 canciones</span>
                        <div id="sort-chip" class="sort-chip">
                            <span id="sort-label">Recientes</span>
                            <div id="sort-menu" class="sort-menu hidden">
                                <div class="sort-option" data-sort="recentlyAdded">Recientes</div>
                                <div class="sort-option" data-sort="recentlyPlayed">Reproducidas</div>
                                <div class="sort-option" data-sort="title">Título</div>
                                <div class="sort-option" data-sort="artist">Artista</div>
                                <div class="sort-option" data-sort="duration">Duración</div>
                            </div>
                        </div>
                    </div>
                    <div id="songs-list"></div>
                    <div id="empty-state" class="empty-state hidden">
                        <div class="empty-icon">♪</div>
                        <h2>Aún no hay música</h2>
                        <p>Arrastra archivos aquí o usa "Agregar música"</p>
                        <button class="btn-primary" onclick="document.getElementById('btn-add').click()">Seleccionar carpeta</button>
                    </div>
                </div>
                <div id="lyrics-panel" class="hidden">
                    <div id="lyrics-content"></div>
                </div>
            </div>
        </main>

        <!-- Player bar -->
        <footer id="playerbar">
            <div class="player-info">
                <div class="player-cover" id="player-cover"></div>
                <div class="player-text">
                    <span class="player-title" id="player-title">No hay canción</span>
                    <span class="player-artist" id="player-artist">—</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" id="btn-shuffle">SHF</button>
                <button class="ctrl-btn" id="btn-prev">«</button>
                <button class="ctrl-btn play-btn" id="btn-play">▶</button>
                <button class="ctrl-btn" id="btn-next">»</button>
                <button class="ctrl-btn" id="btn-repeat">RPT</button>
            </div>
            <div class="player-progress">
                <span id="time-current">0:00</span>
                <input type="range" id="seek-bar" min="0" max="100" value="0" />
                <span id="time-total">0:00</span>
            </div>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
