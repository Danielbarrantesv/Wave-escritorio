<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Sidebar -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <span class="logo">Wave</span>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" data-view="all" onclick="selectAllSongs()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
                    <span>Todas las canciones</span>
                </div>
            </div>
            <div class="sidebar-section">
                <span class="sidebar-title">Playlists</span>
                <div id="playlists-list"></div>
            </div>
        </aside>

        <!-- Main content -->
        <main id="main">
            <header id="topbar">
                <div class="search-container">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="search-icon"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                    <input type="text" id="search" placeholder="Buscar canciones, artistas, álbumes..." />
                </div>
                <div class="topbar-actions">
                    <button id="btn-add" class="btn-primary">+ Agregar música</button>
                    <button id="btn-mini" class="btn-icon" title="Mini player">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 5h18v4H3V5zm0 6h12v8H3v-8z"/></svg>
                    </button>
                    <button id="btn-lyrics" class="btn-icon" title="Letra">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M14 17H4v2h10v-2zm6-8H4v2h16V9zM4 15h16v-2H4v2zM4 5v2h16V5H4z"/></svg>
                    </button>
                    <button id="btn-eq" class="btn-icon" title="Ecualizador">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 21h2v-6H7v6zm4 0h2V11h-2v10zm4 0h2V7h-2v14zM3 3v2h18V3H3z"/></svg>
                    </button>
                    <button id="btn-backup" class="btn-icon" title="Backup">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
                    </button>
                </div>
            </header>

            <div id="content">
                <div id="songs-container">
                    <div id="songs-header">
                        <span id="song-count">0 canciones</span>
                        <div id="sort-chip" class="sort-chip">
                            <span id="sort-label">Recientes</span>
                            <div id="sort-menu" class="sort-menu hidden">
                                <div class="sort-option" data-sort="recentlyAdded">Recientes</div>
                                <div class="sort-option" data-sort="recentlyPlayed">Reproducidas</div>
                                <div class="sort-option" data-sort="title">Título</div>
                                <div class="sort-option" data-sort="artist">Artista</div>
                                <div class="sort-option" data-sort="duration">Duración</div>
                            </div>
                        </div>
                    </div>
                    <div id="songs-list"></div>
                    <div id="empty-state" class="empty-state hidden">
                        <div class="empty-icon">♪</div>
                        <h2>Aún no hay música</h2>
                        <p>Arrastra archivos aquí o usa "Agregar música"</p>
                        <button class="btn-primary" onclick="document.getElementById('btn-add').click()">Seleccionar carpeta</button>
                    </div>
                </div>
                <div id="lyrics-panel" class="hidden">
                    <div id="lyrics-content"></div>
                </div>
            </div>
        </main>

        <!-- Player bar -->
        <footer id="playerbar">
            <div class="player-info">
                <div class="player-cover" id="player-cover"></div>
                <div class="player-text">
                    <span class="player-title" id="player-title">No hay canción</span>
                    <span class="player-artist" id="player-artist">—</span>
                </div>
            </div>
            <div class="player-controls">
                <button class="ctrl-btn" id="btn-shuffle" title="Aleatorio">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <button class="ctrl-btn" id="btn-prev" title="Anterior">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-btn" id="btn-play" title="Reproducir/Pausar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn" id="btn-next" title="Siguiente">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="ctrl-btn" id="btn-repeat" title="Repetir">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
                </button>
            </div>
            <div class="player-progress">
                <span id="time-current" class="time-label">0:00</span>
                <input type="range" id="seek-bar" min="0" max="100" value="0" />
                <span id="time-total" class="time-label">0:00</span>
            </div>
        </footer>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
