<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wave</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
    <body ondragover="event.preventDefault()" ondrop="handleDrop(event)">
    <div id="app">
        <div id="titlebar">
            <div class="titlebar-drag"><img src="img/logo.svg" width="20" height="20" style="vertical-align:middle;margin-right:8px;border-radius:3px;"><span class="titlebar-title">Wave</span></div>
            <div class="titlebar-buttons">
                <button class="titlebar-btn" onclick="minimizeWindow()" title="Minimizar"><svg width="12" height="12" viewBox="0 0 24 24"><rect y="11" width="24" height="2" fill="currentColor"/></svg></button>
                <button class="titlebar-btn" onclick="maximizeWindow()" title="Maximizar"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M3,21V16H5v3H8v2H3Zm13,0V19h3V16h2v5H16ZM3,8V3H8V5H5V8H3ZM19,8V5H16V3h5V8H19Z"/></svg></button>
                <button class="titlebar-btn close-btn" onclick="closeWindow()" title="Cerrar"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4,19L5,17.6L10.6,12L5,6.4L6.4,5L12,10.6L17.6,5L19,6.4L13.4,12L19,17.6L17.6,19L12,13.4L6.4,19Z"/></svg></button>
            </div>
        </div>
        <div id="body-area">
            <aside id="sidebar">
                <div class="sidebar-header">
                    <button class="btn-add-playlist" onclick="createPlaylist()" title="Crear playlist">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z"/></svg>
                        <span>Crear playlist</span>
                    </button>
                </div>
                <div class="sidebar-nav"><div class="nav-item active" data-view="all" onclick="selectAllSongs()"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg><span>Todas las canciones</span></div></div>
                <div class="sidebar-section"><span class="sidebar-title">Playlists</span><div id="playlists-list"></div></div>
            </aside>
            <main id="main">
                <header id="topbar">
                    <div class="search-container"><span class="search-icon"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg></span><input type="text" id="search" placeholder="Buscar canciones, artistas, álbumes..." /></div>
                    <div class="topbar-actions">
                        <button id="btn-add" class="btn-primary">+ Agregar música</button>
                        <button id="btn-backup" class="btn-icon" title="Backup"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg></button>
                        <button id="btn-settings" class="btn-icon" title="Configuración"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg></button>
                    </div>
                </header>
                <div id="content">
                    <div id="songs-container">
                        <div id="selection-bar" class="selection-bar hidden">
                            <span id="selection-count">0 seleccionadas</span>
                            <div class="selection-actions">
                                <button class="btn-primary small" onclick="addSelectionToPlaylist()">Agregar a playlist</button>
                                <button class="btn-icon" onclick="deleteSelection()" title="Eliminar"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
                                <button class="btn-icon" onclick="clearSelection()" title="Limpiar selección"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6.4,19L5,17.6L10.6,12L5,6.4L6.4,5L12,10.6L17.6,5L19,6.4L13.4,12L19,17.6L17.6,19L12,13.4L6.4,19Z"/></svg></button>
                            </div>
                        </div>
                        <div id="sticky-section">
                            <div id="recent-section" style="display:none;">
                                <div class="recent-section-title">Reproducidas recientemente</div>
                                <div id="recent-slider"></div>
                            </div>
                            <div id="artists-section" style="display:none;">
                                <div class="recent-section-title">Artistas</div>
                                <div id="artists-slider"></div>
                            </div>
                        </div>
                        <div id="songs-header"><span id="song-count">0 canciones</span>
                            <div id="sort-chip" class="sort-chip"><span id="sort-label">Recientes</span><div id="sort-menu" class="sort-menu hidden"><div class="sort-option" data-sort="recentlyAdded">Recientes</div><div class="sort-option" data-sort="recentlyPlayed">Reproducidas</div><div class="sort-option" data-sort="title">Título</div><div class="sort-option" data-sort="artist">Artista</div><div class="sort-option" data-sort="duration">Duración</div></div></div>
                        </div>
                        <div id="songs-list"></div>
                        <div id="empty-state" class="empty-state hidden"><div class="empty-icon">♪</div><h2>Aún no hay música</h2><p>Arrastra archivos aquí o usa "Agregar música"</p><button class="btn-primary" onclick="document.getElementById('btn-add').click()">Seleccionar carpeta</button></div>
                    </div>
                    <aside id="side-panel" class="side-panel closed">
                        <div class="side-panel-bg" id="side-panel-bg"></div>
                        <button class="side-panel-close" onclick="closeSidePanel()" title="Cerrar">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.4,19L5,17.6L10.6,12L5,6.4L6.4,5L12,10.6L17.6,5L19,6.4L13.4,12L19,17.6L17.6,19L12,13.4L6.4,19Z"/></svg>
                        </button>
                        <div class="side-panel-content" id="lyrics-content"></div>
                        <div class="side-panel-content" id="eq-content" style="display:none;">
                            <div class="eq-header"><h2>Ecualizador</h2><div class="eq-controls"><button id="eq-toggle" class="btn-primary small">ON</button><button id="eq-reset" class="btn-icon">Reset</button></div></div>
                            <div id="eq-bands" class="eq-bands"></div>
                        </div>
                    </aside>
                </div>
            </main>
        </div>
        <footer id="playerbar">
            <div class="player-info"><div class="player-cover" id="player-cover"><div class="placeholder-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" height="24px" width="24px" fill="currentColor"><path d="M3.18,19.83Q2,18.65 2,17t1.18-2.83T6,13q0.58,0 1.06,0.14T8,13.55V5L20,3V15q0,1.65-1.18,2.82T16,19t-2.82-1.18T12,15t1.18-2.83T16,11q0.57,0 1.06,0.14T18,11.55V7.43L10,9v8q0,1.65-1.17,2.82T6,21T3.18,19.83Z"/></svg></div></div><div class="player-text"><span class="player-title" id="player-title">Canción</span><span class="player-artist" id="player-artist">Artista</span></div></div>
            <div class="player-center"><div class="player-controls">
                <button class="ctrl-btn" id="btn-shuffle" title="Aleatorio"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg></button>
                <button class="ctrl-btn" id="btn-prev" title="Anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
                <button class="ctrl-btn play-btn" id="btn-play" title="Reproducir"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="play-icon"><path d="M8 5v14l11-7z"/></svg></button>
                <button class="ctrl-btn" id="btn-next" title="Siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
                <button class="ctrl-btn" id="btn-repeat" title="Repetir"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg></button>
            </div><div class="player-progress"><span id="time-current" class="time-label">0:00</span><input type="range" id="seek-bar" min="0" max="100" value="0" /><span id="time-total" class="time-label">0:00</span></div></div>
            <div class="player-right">
                <button class="ctrl-btn" id="btn-lyrics" title="Letra"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17,10q-0.82,0-1.41-0.58T15,8V4q0-0.85 0.59-1.43T17,2q0.85,0 1.43,0.57T19,4V8q0,0.85-0.57,1.42T17,10ZM5,22q-0.83,0-1.41-0.59T3,20V4Q3,3.17 3.59,2.59T5,2h8V4H5V20H16V18h2v2q0,0.82-0.59,1.41T16,22H5Zm2-4V16h7v2H7Zm0-3V13h5v2H7Zm11,1H16V13.4q-1.92-0.35-3.21-1.86Q11.5,10.02 11.5,8h2q0,1.45 1.03,2.47T17,11.5q1.48,0 2.49-1.03T20.5,8h2q0,2.02-1.27,3.54T18,13.4V16Z"/></svg></button>
                <button class="ctrl-btn" id="btn-eq" title="Ecualizador"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M11,21V15h2v2h8v2H13v2H11ZM3,19V17H9v2H3Zm4-4V13H3V11H7V9H9v6H7Zm4-2V11H21v2H11Zm4-4V3h2V5h4V7H17V9H15ZM3,7V5H13V7H3Z"/></svg></button>
                <button class="ctrl-btn" id="btn-mini" title="Mini player"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12,7.65ZM16.35,12Zm-8.7,0ZM12,16.35Zm0-5.85l-3-3V2h6V7.5l-3,3ZM16.5,15l-3-3l3-3H22v6H16.5ZM2,15V9H7.5l3,3l-3,3H2Zm7,7V16.5l3-3l3,3V22H9ZM12,7.65l1-1V4H11V6.65l1,1ZM4,13H6.65l1-1l-1-1H4v2Zm7,7h2V17.35l-1-1l-1,1V20Zm6.35-7H20V11H17.35l-1,1l1,1Z"/></svg></button>
                <div id="vol-icon-container" class="vol-icon-container" onclick="toggleMute()">
                    <svg id="vol-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M14,20.73V18.68q2.25-0.65 3.63-2.5T19,11.98t-1.38-4.2Q16.25,5.93 14,5.27V3.22q3.1,0.7 5.05,3.14T21,11.98t-1.95,5.61T14,20.73ZM3,15V9H7l5-5V20L7,15H3Zm11,1V7.95Q15.18,8.5 15.84,9.6T16.5,12q0,1.27-0.66,2.36T14,16ZM10,8.85L7.85,11H5v2H7.85L10,15.15V8.85ZM7.5,12Z"/></svg>
                </div>
                <input type="range" id="volume-bar" min="0" max="100" value="100" class="volume-slider" />
            </div>
        </footer>
    </div>

    <!-- Custom modal dialog -->
    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModalIfOverlay(event)">
        <div id="modal-dialog" class="modal-dialog">
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Context menus -->
    <div id="context-menu" class="context-menu hidden"></div>
    <div id="playlist-context-menu" class="context-menu hidden"></div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
